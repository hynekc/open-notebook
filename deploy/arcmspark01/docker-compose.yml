# Open Notebook (česká lokalizace) na DGX Spark arcmspark01
# Autor nasazení: Hynek Cihlář (Bc. Hynek Cihlář)
#
# Čtyři služby na jednom Sparku:
#   vllm-qwen      jazykový model Qwen/Qwen3.8-27B-FP8 + MTP (vLLM, GPU)
#   vllm-embed     embedding model BAAI/bge-m3 (vLLM, GPU)
#   vllm-whisper   přepis řeči openai/whisper-large-v3 (vLLM, GPU)
#   surrealdb      databáze Open Notebooku
#   open_notebook  webové rozhraní (8502), API (5055) a worker – image se staví
#                  z tohoto repozitáře (větev cs-CZ s českým UI)
#
# Spouští se ze složky deploy/arcmspark01 (viz README.md):
#   docker compose up -d
#
# Data leží mimo repozitář v ON_DATA_DIR (výchozí /home/spark/open-notebook-data),
# modely v HF_CACHE_DIR (výchozí /home/spark/.cache/huggingface).

name: open-notebook

services:
  vllm-qwen:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:qwen38}
    container_name: on-vllm-qwen
    restart: unless-stopped
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-/home/spark/.cache/huggingface}:/root/.cache/huggingface
    ports:
      # Jen pro kontroly z arcmspark01 (curl). Open Notebook volá vLLM přes
      # vnitřní síť compose (http://vllm-qwen:8000/v1).
      - "127.0.0.1:${QWEN_HOST_PORT:-8010}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - Qwen/Qwen3.8-27B-FP8
      - --served-model-name
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      # Sdílená (unified) paměť 128 GB: ~0,70 pro Qwen, ~0,06 pro bge-m3,
      # zbytek pro systém, SurrealDB a Open Notebook.
      - --gpu-memory-utilization
      - "${QWEN_GPU_MEM:-0.70}"
      - --max-model-len
      - "${QWEN_MAX_MODEL_LEN:-262144}"
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "${QWEN_MAX_NUM_SEQS:-8}"
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      # Uvažování (thinking) ve výchozím stavu vypnuto: Open Notebook čeká na
      # odpověď jen ESPERANTO_LLM_TIMEOUT sekund a podcasty potřebují čistý JSON.
      # Pro zapnutí nastavte QWEN_ENABLE_THINKING=true v .env.
      - --default-chat-template-kwargs
      - '{"enable_thinking": ${QWEN_ENABLE_THINKING:-false}}'
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s   # první start stahuje ~31 GB vah

  vllm-embed:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:qwen38}
    container_name: on-vllm-embed
    restart: unless-stopped
    ipc: host
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-/home/spark/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${EMBED_HOST_PORT:-8011}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - BAAI/bge-m3
      - --served-model-name
      - bge-m3
      - --runner
      - pooling
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "${EMBED_GPU_MEM:-0.06}"
      - --max-model-len
      - "8192"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s

  vllm-whisper:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:qwen38}
    container_name: on-vllm-whisper
    restart: unless-stopped
    ipc: host
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-/home/spark/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${WHISPER_HOST_PORT:-8012}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - openai/whisper-large-v3
      - --served-model-name
      - whisper-large-v3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "${WHISPER_GPU_MEM:-0.05}"
      - --max-num-seqs
      - "4"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s

  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: on-surrealdb
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:-root}", "rocksdb:/mydata/mydatabase.db"]
    user: root
    # Port se nepublikuje: Open Notebook se k databázi připojuje přes vnitřní síť.
    volumes:
      - ${ON_DATA_DIR:-/home/spark/open-notebook-data}/surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: unless-stopped

  open_notebook:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    image: open-notebook-cs:${ON_IMAGE_TAG:-local}
    container_name: on-app
    ports:
      - "${UI_PORT:-8502}:8502"   # webové rozhraní
      - "${API_PORT:-5055}:5055"  # REST API (prohlížeč ho volá přímo)
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:?Nastavte OPEN_NOTEBOOK_ENCRYPTION_KEY v .env}
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:?Nastavte OPEN_NOTEBOOK_PASSWORD v .env}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      # Lokální Qwen na jednom Sparku je pomalejší než cloud: delší limit na
      # jedno volání modelu (musí zůstat pod 600) a méně souběžných úloh.
      - ESPERANTO_LLM_TIMEOUT=${ESPERANTO_LLM_TIMEOUT:-420}
      - OPEN_NOTEBOOK_WORKER_MAX_TASKS=${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-2}
      # Volitelně: Docling (tabulky, OCR skenů, obrázky). První start stáhne
      # několik GB. Zapnete nastavením ENABLE_DOCLING=true v .env.
      - OPEN_NOTEBOOK_ENABLE_DOCLING=${ENABLE_DOCLING:-false}
      # Přepis zvuku a videa přes Whisper (vllm-whisper): Open Notebook dělí
      # nahrávky na 10min úseky; s jedním lokálním serverem posílat po dvou.
      - CCORE_AUDIO_CONCURRENCY=${CCORE_AUDIO_CONCURRENCY:-2}
    volumes:
      - ${ON_DATA_DIR:-/home/spark/open-notebook-data}/notebook_data:/app/data
    depends_on:
      - surrealdb
      - vllm-qwen
      - vllm-embed
      - vllm-whisper
    restart: unless-stopped
